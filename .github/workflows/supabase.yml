name: Deploy Supabase backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL repository secret" && exit 1)
          supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Configure Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SECRETS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CPI_ADMIN_EMAIL: ${{ secrets.CPI_ADMIN_EMAIL }}
          CPI_SITE_ORIGIN: ${{ secrets.CPI_SITE_ORIGIN }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF CPI_ADMIN_EMAIL CPI_SITE_ORIGIN; do
            test -n "${!name}" || (echo "Missing $name repository secret" && exit 1)
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            CPI_ADMIN_EMAIL="$CPI_ADMIN_EMAIL" \
            CPI_SITE_ORIGIN="$CPI_SITE_ORIGIN"
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy cpi-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

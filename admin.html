<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2">
  <title>CPI 测评 · 管理后台</title><script src="./supabase-config.js"></script>
  <style>
    :root{--ink:#20231f;--muted:#757970;--paper:#f7f6f2;--line:#e6e5de;--green:#c7f36b;--coral:#fa806b;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans SC",sans-serif}.shell{max-width:1120px;margin:auto;padding:0 30px}header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:700}.brand i{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--ink);color:var(--green);border-radius:9px 9px 9px 3px;font-style:normal;margin-right:9px}.tag{font:10px monospace;border:1px solid var(--line);border-radius:30px;padding:8px 11px;color:var(--muted)}main{padding:44px 0 65px}.eyebrow{font:11px monospace;letter-spacing:.12em;color:#73786d}.title-row{display:flex;align-items:end;justify-content:space-between;margin:12px 0 27px}h1{font-size:38px;letter-spacing:-.06em;margin:0}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.card,.box{background:white;border:1px solid var(--line);border-radius:10px;padding:19px}.card span{color:var(--muted);font-size:12px}.card b{display:block;font:28px monospace;margin-top:9px}.box{margin:14px 0}.box h2{font-size:16px;margin:0 0 15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;min-width:160px}.field:focus{outline:2px solid #c7f36b}.btn{border:1px solid var(--line);background:white;border-radius:6px;padding:10px 13px;cursor:pointer;color:var(--ink);font:inherit;font-size:12px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.danger{color:#a4382b}.btn:disabled{opacity:.5;cursor:wait}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:500}td code{font-family:monospace;font-weight:bold}.pill{display:inline-block;border-radius:20px;padding:5px 8px;background:#eef6dc;font-size:10px}.pill.off{background:#fce8e3;color:#a4382b}.actions{display:flex;gap:5px;flex-wrap:wrap}.login-wrap{max-width:420px;margin:50px auto}.login-wrap .box{padding:26px}.login-wrap h1{font-size:27px;margin:8px 0 20px}.login-wrap .field{width:100%;margin:7px 0 12px}.error{min-height:17px;color:#a4382b;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--ink);color:#fff;border-radius:30px;padding:11px 15px;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid var(--line);padding:18px 0;color:#999;font-size:10px}@media(max-width:650px){.shell{padding:0 17px}main{padding-top:30px}header{height:66px}.title-row{align-items:start;gap:10px;flex-direction:column}h1{font-size:32px}.cards{gap:7px}.card{padding:13px 10px}.card b{font-size:21px}.card span{font-size:10px}.box{padding:15px}.field{flex:1;min-width:135px}.toolbar{width:100%;justify-content:space-between}}
  </style>
</head>
<body><div class="shell">
  <header><div class="brand"><i>C</i>状态观察室 · 管理后台</div><div class="toolbar"><a class="tag" href="/" style="text-decoration:none">返回测评 ↗</a><button id="logout" class="btn hidden">退出登录</button></div></header>
  <main>
    <section id="loginView" class="login-wrap"><div class="box"><div class="eyebrow">ADMIN ACCESS</div><h1>管理员登录</h1><form id="loginForm"><label class="muted" for="email">管理员邮箱</label><input id="email" class="field" type="email" autocomplete="username" required><label class="muted" for="password">管理员口令</label><input id="password" class="field" type="password" autocomplete="current-password" required><div id="loginError" class="error"></div><button class="btn primary" type="submit">登录管理后台 ↗</button></form><p class="hint">使用你在 Supabase Auth 中创建并授权的管理员账号登录。</p></div></section>
    <section id="dashboard" class="hidden"><div class="eyebrow">CPI / ADMIN CONSOLE</div><div class="title-row"><div><h1>测评密码管理</h1><div class="muted" style="margin-top:8px">创建密码、查看额度使用情况，或重置和停用已有密码。</div></div><button id="refresh" class="btn">刷新数据 ↻</button></div>
      <div class="cards"><div class="card"><span>密码总数</span><b id="statCodes">0</b></div><div class="card"><span>已使用测评次数</span><b id="statUses">0</b></div><div class="card"><span>已完成结果数</span><b id="statResults">0</b></div></div>
      <div class="box"><h2>生成测试密码</h2><form id="createForm" class="row"><input class="field" id="label" maxlength="80" placeholder="备注（可选，例如：活动A）"><label class="muted">每个密码次数</label><input class="field" id="maxUses" type="number" min="1" max="1000" value="3" style="width:95px;min-width:80px"><label class="muted">生成数量</label><input class="field" id="quantity" type="number" min="1" max="100" value="1" style="width:85px;min-width:75px"><button class="btn primary" type="submit">生成密码 +</button></form><p class="hint">密码只在生成后显示一次，请立即复制并妥善保存。此服务默认只在本机开放，跨设备使用需部署到 HTTPS 服务。</p></div>
      <div class="box"><div class="title-row" style="margin:0 0 10px;align-items:center;flex-direction:row"><h2 style="margin:0">现有密码</h2><button class="btn" id="exportCsv">导出 CSV</button></div><div class="table-wrap"><table><thead><tr><th>测试密码</th><th>备注</th><th>已用 / 上限</th><th>状态</th><th>创建时间</th><th>管理操作</th></tr></thead><tbody id="codesBody"></tbody></table></div></div>
      <div class="box"><h2>修改管理员口令</h2><form id="changeForm" class="row"><input class="field" type="password" id="currentPassword" placeholder="当前口令" required><input class="field" type="password" id="newPassword" placeholder="新口令（至少 12 位）" minlength="12" required><button class="btn" type="submit">更新口令</button></form></div>
    </section>
  </main><footer>状态观察室 · CPI 测评管理控制台</footer>
</div><div id="toast" class="toast" role="status"></div>
<script>
  const $=id=>document.getElementById(id);let codes=[];let timer;
  async function api(path,options={}){const config=window.CPI_CONFIG;if(config?.supabaseUrl&&config?.anonKey){const map={'/api/admin/session':'admin-session','/api/admin/login':'admin-login','/api/admin/logout':'admin-logout','/api/admin/codes':'admin-codes','/api/admin/change-password':'admin-password'};let endpoint=map[path];if(!endpoint){const m=path.match(/^\/api\/admin\/codes\/(\d+)$/);if(m){const action=JSON.parse(options.body||'{}').action;endpoint=`admin-code-${m[1]}-${action}`}}if(endpoint==='admin-session')return{authenticated:!!sessionStorage.getItem('cpiAdminToken')};if(endpoint==='admin-logout'){sessionStorage.removeItem('cpiAdminToken');return{ok:true}}const headers={'Content-Type':'application/json','apikey':config.anonKey,...(options.headers||{})};const token=sessionStorage.getItem('cpiAdminToken');if(token)headers.Authorization=`Bearer ${token}`;const payload=options.body?JSON.parse(options.body):{};if(endpoint==='admin-login'){const data=await fetch(`${config.supabaseUrl.replace(/\/$/,'')}/functions/v1/cpi-api/${endpoint}`,{method:'POST',headers,body:JSON.stringify({email:$('email').value,password:payload.password})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'登录失败');return d});sessionStorage.setItem('cpiAdminToken',data.access_token);return data}const body=endpoint==='admin-password'?{password:payload.new}:payload;const res=await fetch(`${config.supabaseUrl.replace(/\/$/,'')}/functions/v1/cpi-api/${endpoint}`,{method:options.method||'GET',headers,body:options.method==='POST'?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`请求失败 (${res.status})`);return data}const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`请求失败 (${res.status})`);return data}
  function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
  function showDashboard(){ $('loginView').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');loadCodes() }
  async function checkSession(){try{const d=await api('/api/admin/session');if(d.authenticated)showDashboard()}catch{}}
  $('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showDashboard()}catch(err){$('loginError').textContent=err.message}};
  async function loadCodes(){try{const d=await api('/api/admin/codes');codes=d.codes;$('statCodes').textContent=d.stats.codes;$('statUses').textContent=d.stats.uses;$('statResults').textContent=d.stats.results;$('codesBody').innerHTML=codes.map(c=>`<tr><td><code>${esc(c.code_display)}</code></td><td>${esc(c.label||'—')}</td><td>${c.used_count} / ${c.max_uses}</td><td><span class="pill ${c.active?'':'off'}">${c.active?'启用':'已停用'}</span></td><td>${new Date(typeof c.created_at==='number'?c.created_at*1000:c.created_at).toLocaleString()}</td><td><div class="actions"><button class="btn" data-act="copy" data-id="${c.id}">复制</button><button class="btn" data-act="reset" data-id="${c.id}">重置次数</button><button class="btn" data-act="toggle" data-id="${c.id}">${c.active?'停用':'启用'}</button><button class="btn danger" data-act="delete" data-id="${c.id}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无测试密码</td></tr>'}catch(err){if(err.message.includes('登录')){sessionStorage.removeItem('cpiAdminToken');location.reload();return}toast(err.message)}}
  function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  $('createForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/admin/codes',{method:'POST',body:JSON.stringify({label:$('label').value,max_uses:Number($('maxUses').value),quantity:Number($('quantity').value)})});const copied=await copy(d.codes.join('\n'));alert(`已生成密码：\n\n${d.codes.join('\n')}\n\n${copied?'已复制到剪贴板。':'请立即复制并保存。'}`);$('label').value='';loadCodes()}catch(err){toast(err.message)}};
  async function copy(value){try{await navigator.clipboard.writeText(value);return true}catch{const el=document.createElement('textarea');el.value=value;document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();return ok}}
  $('codesBody').onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const c=codes.find(x=>x.id===Number(b.dataset.id));try{if(b.dataset.act==='copy'){toast(await copy(c.code_display)?'密码已复制':'复制失败，请手动复制');return}let message={reset:'重置此密码的已用次数？',toggle:`确定${c.active?'停用':'启用'}此密码？`,delete:'删除此密码？此操作不可撤销。'}[b.dataset.act];if(!confirm(message))return;await api(`/api/admin/codes/${c.id}`,{method:'POST',body:JSON.stringify({action:b.dataset.act})});loadCodes();toast('已更新')}catch(err){toast(err.message)}};
  $('refresh').onclick=loadCodes;$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});location.reload()};
  $('changeForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/change-password',{method:'POST',body:JSON.stringify({current:$('currentPassword').value,new:$('newPassword').value})});alert('管理员口令已更新，请使用新口令重新登录。');location.reload()}catch(err){toast(err.message)}};
  $('exportCsv').onclick=()=>{const rows=[['测试密码','备注','已用次数','次数上限','状态','创建时间'],...codes.map(c=>[c.code_display,c.label,c.used_count,c.max_uses,c.active?'启用':'已停用',new Date(c.created_at*1000).toLocaleString()])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='CPI测试密码.csv';a.click();URL.revokeObjectURL(a.href)};
  checkSession();
</script></body></html>
